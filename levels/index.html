<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proflex Levels</title>
<style>
:root{--bg:#0f1218;--card:#171b23;--line:#2a2f3a;--txt:#e6e8ec;--mute:#8a909c;--run:#ef5350;--worry:#ff9800;--clear:#26a69a;--tp:#2962ff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f7f9;--card:#fff;--line:#e2e5ea;--txt:#151820;--mute:#5d6470}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:26px;margin:0 0 4px}.sub{color:var(--mute);font-size:13px;margin-bottom:18px}
input{width:100%;max-width:280px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:15px;margin-bottom:14px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
td.sym{font-weight:700}.run{color:var(--run)}.worry{color:var(--worry)}.clear{color:var(--clear)}.tp{color:var(--tp)}
.dir{font-weight:600}.up{color:var(--clear)}.down{color:var(--run)}.side{color:var(--worry)}
td.note{white-space:normal;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
<h1>Proflex Levels</h1>
<div class="sub" id="meta">Loading…</div>
<input id="q" placeholder="Filter ticker…" autocomplete="off">
<div class="wrap"><table>
<thead><tr><th>Ticker</th><th>Dir</th><th>Run</th><th>Worry</th><th>Clear</th><th>Take Profit</th><th>Note</th></tr></thead>
<tbody id="rows"></tbody>
</table></div>
</main>
<script>
let rows = [];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dirCls = d => /up/i.test(d) ? "up" : /down/i.test(d) ? "down" : /flat|chop/i.test(d) ? "side" : "";
function render() {
  const q = document.getElementById("q").value.trim().toUpperCase();
  document.getElementById("rows").innerHTML = rows.filter(r => !q || r.symbol.includes(q)).map(r =>
    `<tr><td class="sym">${esc(r.symbol)}</td><td class="dir ${dirCls(r.dir)}">${esc(r.dir)}</td>` +
    `<td class="run">${esc(r.run)}</td><td class="worry">${esc(r.worry)}</td><td class="clear">${esc(r.clear)}</td>` +
    `<td class="tp">${esc(r.take_profit) || "—"}</td><td class="note">${esc(r.note)}</td></tr>`).join("");
}
async function load() {
  try {
    const d = await (await fetch("levels.json?t=" + Date.now(), {cache: "no-store"})).json();
    rows = d.rows;
    document.getElementById("meta").textContent =
      `${rows.length} tickers · updated ${new Date(d.updated_at).toLocaleString()} by ${d.updated_by}`;
    render();
  } catch (e) { document.getElementById("meta").textContent = "Could not load levels.json"; }
}
document.getElementById("q").addEventListener("input", render);
load(); setInterval(load, 60000);
</script>
</body>
</html>
